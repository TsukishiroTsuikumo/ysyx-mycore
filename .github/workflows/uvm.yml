name: UVM elaboration

on:
  push:
    branches:
      - codex/complete-readme-roadmap
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilator-uvm-build:
    name: Verilator/UVM build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: verilator/verilator:v5.050
    env:
      UVM_HOME: ${{ github.workspace }}/.ci/uvm-core
    steps:
      - name: Check out core repository
        uses: actions/checkout@v4

      - name: Check out Accellera UVM 2020.3.1
        uses: actions/checkout@v4
        with:
          repository: accellera-official/uvm-core
          ref: 2020.3.1
          path: .ci/uvm-core

      - name: Report tool versions
        run: |
          verilator --version
          g++ --version
          make --version

      - name: Elaborate and build the UVM testbench with coverage
        run: make build COVERAGE=1

      - name: Run cache, AXI, and differential smoke test
        run: |
          mkdir -p log
          make run-only \
            COVERAGE=1 \
            TEST=mem_image_test \
            MEM_FILE=test_bench/programs/axi_smoke.mem \
            TARGET_COMMITS=32 \
            TIMEOUT_CYCLES=20000 \
            SIM_TIMEOUT=50000 \
            LOG=log/axi-smoke.log

      - name: Enforce smoke-test acceptance markers
        run: |
          grep -Eq 'PROGRAM_SCORE.*PASS=[1-9][0-9]* FAIL=0 MISSING=0 EXTRA=0' log/axi-smoke.log
          grep -Eq 'AXI_ACCEPTANCE.*status=PASS' log/axi-smoke.log
          grep -Eq 'AXI_PROTOCOL_REPORT:.*procedural_errors=0' log/axi-smoke.log
          if grep -Eq 'UVM_(ERROR|FATAL)[[:space:]]*:[[:space:]]*[1-9]' log/axi-smoke.log; then
            echo 'UVM reported errors or fatals'
            exit 1
          fi

      - name: Generate line report and retain toggle database
        run: |
          test -s obj_dir/coverage.dat
          verilator_coverage --write-info obj_dir/coverage.info obj_dir/coverage.dat
          test -s obj_dir/coverage.info

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: verilator-coverage
          path: |
            obj_dir/coverage.dat
            obj_dir/coverage.info
            log/axi-smoke.log
          if-no-files-found: error
